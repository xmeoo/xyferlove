<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#050305"><title>Xyfer</title><link id="site-icon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23130a0d'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial' font-size='35' font-weight='700' fill='white'%3EX%3C/text%3E%3C/svg%3E">
<style>
:root{--accent:#ff4769;--soft:#ff7490;--panel:#150c10c9;--art:#a82748;--dark:#220b13;--bgfilter:none}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050305;color:#f6eef0;font-family:Arial,Helvetica,sans-serif}button,input,select,a{-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}.backdrop{position:fixed;inset:0;width:100%;height:100%;border:0;pointer-events:none;filter:var(--bgfilter);transition:filter .35s}.backdrop.library{opacity:.45}header{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:3;display:flex;padding:5px;gap:4px;border:1px solid #ffffff20;border-radius:40px;background:#10090bd9;backdrop-filter:blur(20px)}header a{padding:11px 22px;border-radius:30px;text-decoration:none;font-size:13px;color:#c8b8bd}header a[aria-current=page]{background:#ffffff12;color:white}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}main{position:fixed;inset:92px 0 0;overflow:auto;padding:42px max(24px,8vw)}[hidden]{display:none!important}h1{font-size:clamp(38px,6vw,68px);letter-spacing:-3px;margin:0 0 36px;font-weight:500}.library-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:24px;max-width:1120px}.game{display:block;width:100%;text-align:left;color:inherit;background:var(--panel);border:1px solid #ffffff20;border-radius:22px;padding:0;overflow:hidden;transition:transform .2s,border-color .2s}.game:hover{transform:translateY(-5px);border-color:var(--accent)}.art{height:180px;display:grid;place-items:center;background:radial-gradient(ellipse at 70% 20%,var(--art),transparent 70%),linear-gradient(140deg,var(--dark),#090608)}.art img{width:112px;height:112px;object-fit:cover;border-radius:25px;box-shadow:0 16px 45px #0008}.details{display:flex;justify-content:space-between;align-items:center;padding:22px;font-size:19px;letter-spacing:-.5px}.details span:last-child{color:var(--soft)}.credits{font-size:12px;color:#ae939c;line-height:1.7;margin:22px 0 40px}.settings-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px;max-width:900px}.setting-card{padding:26px;border:1px solid #ffffff20;border-radius:22px;background:var(--panel);backdrop-filter:blur(16px)}.setting-card h2{font-size:18px;margin:0 0 8px}.setting-card p{font-size:13px;line-height:1.5;color:#baa8ae;margin:0 0 20px}.field{display:grid;gap:8px;margin-top:15px}.field label{font-size:12px;color:#cbbbc0}.field input,.field select{width:100%;border:1px solid #ffffff22;border-radius:10px;background:#080608;color:white;padding:12px}.swatches,.icon-options{display:flex;flex-wrap:wrap;gap:10px}.swatch{width:42px;height:42px;border-radius:50%;border:2px solid #ffffff24;background:var(--swatch);box-shadow:inset 0 0 0 5px #080608}.swatch[aria-pressed=true]{border-color:white;transform:scale(1.08)}.icon-choice{width:54px;height:54px;border-radius:12px;border:1px solid #ffffff22;background:#080608;color:white;font-size:23px}.icon-choice[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}.save-row{display:flex;gap:10px;margin-top:20px}.primary,.quiet{border:1px solid #ffffff22;border-radius:10px;padding:11px 15px;color:white;background:var(--accent)}.quiet{background:#ffffff0a}.saved{font-size:12px;color:var(--soft);align-self:center}.player{position:fixed;inset:0;z-index:5;background:#050305;display:flex;flex-direction:column}.toolbar{height:64px;flex-shrink:0;display:flex;align-items:center;gap:20px;padding:12px 20px;border-bottom:1px solid #ffffff20}.toolbar strong{font-weight:500;font-size:14px;flex:1}.toolbar button,.toolbar a{background:#ffffff0b;border:1px solid #ffffff20;border-radius:8px;padding:9px 14px;color:white;text-decoration:none;font-size:12px}iframe{width:100%;flex:1;border:0;min-height:0}.status{color:#b99fa7;font-size:12px}@media(max-width:600px){main{padding-top:25px}header a{padding:10px 15px}.toolbar{gap:8px;padding:10px}.toolbar strong{font-size:12px}.status{display:none}}@media(prefers-reduced-motion:reduce){.game,.backdrop{transition:none}}
</style></head><body>
<object class="backdrop" type="image/svg+xml" data="background.svg" aria-label="Xyfer animated background"></object>
<header aria-label="Main navigation"><a href="#home" id="home-link">Home</a><a href="#games" id="games-link">Games</a><a href="#settings" id="settings-link">Settings</a></header>
<main id="games" hidden><h1>Games</h1></main>
<main id="settings" hidden><h1>Settings</h1><div class="settings-wrap">
<section class="setting-card"><h2>Browser tab</h2><p>Choose the title and icon shown on this tab. Your choice stays in this browser.</p><div class="field"><label for="title-preset">Tab name</label><select id="title-preset"><option value="Xyfer">Xyfer</option><option value="Untitled Document — Google Docs">Untitled Document — Google Docs</option><option value="New Tab">New Tab</option><option value="Notes">Notes</option><option value="Calculator">Calculator</option><option value="custom">Custom…</option></select></div><div class="field" id="custom-title-wrap" hidden><label for="custom-title">Custom name</label><input id="custom-title" maxlength="80" placeholder="Tab name"></div><div class="field"><label>Tab icon</label><div class="icon-options" id="icon-options"><button class="icon-choice" data-icon="xyfer" aria-label="Xyfer icon">X</button><button class="icon-choice" data-icon="document" aria-label="Document icon">▤</button><button class="icon-choice" data-icon="blank" aria-label="Blank icon">○</button><button class="icon-choice" data-icon="notes" aria-label="Notes icon">▱</button><button class="icon-choice" data-icon="calculator" aria-label="Calculator icon">▦</button></div></div><div class="save-row"><button class="primary" id="save-tab">Apply</button><span class="saved" id="saved-tab" role="status"></span></div></section>
<section class="setting-card"><h2>Theme</h2><p>Change Xyfer’s accent color and animated background.</p><div class="swatches" id="themes"><button class="swatch" style="--swatch:#ff4769" data-theme="red" aria-label="Crimson theme"></button><button class="swatch" style="--swatch:#4d8dff" data-theme="blue" aria-label="Blue theme"></button><button class="swatch" style="--swatch:#a970ff" data-theme="violet" aria-label="Violet theme"></button><button class="swatch" style="--swatch:#43d68d" data-theme="green" aria-label="Green theme"></button><button class="swatch" style="--swatch:#b8b8c2" data-theme="mono" aria-label="Monochrome theme"></button></div><div class="save-row"><button class="quiet" id="reset-settings">Reset settings</button></div></section>
</div></main>
<section class="player" id="player" aria-label="Game player" hidden><div class="toolbar"><button id="back">← Games</button><strong id="game-title">Game</strong><span class="status" id="status" role="status">Loading player…</span><a id="separate" href="games/geometry-dash/" target="_blank" rel="noopener">Open separately ↗</a><button id="fullscreen">Fullscreen</button></div><iframe id="frame" title="Geometry Dash" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe></section>
<template id="library-content"><div class="library-grid">
<button class="game" data-game="geometry-dash" aria-label="Play Geometry Dash"><div class="art"><img src="assets/icons/geometry-dash.png" alt="" decoding="async" loading="lazy"></div><div class="details"><span>Geometry Dash</span><span>↗</span></div></button>
<button class="game" data-game="crazy-cattle-3d" aria-label="Play Crazy Cattle 3D"><div class="art"><img src="assets/icons/crazy-cattle-3d.png" alt="" decoding="async" loading="lazy"></div><div class="details"><span>Crazy Cattle 3D</span><span>↗</span></div></button>
<button class="game" data-game="idle-breakout" aria-label="Play Idle Breakout"><div class="art"><img src="assets/icons/idle-breakout.png" alt="" decoding="async" loading="lazy"></div><div class="details"><span>Idle Breakout</span><span>↗</span></div></button>
<button class="game" data-game="slope" aria-label="Play Slope"><div class="art"><img src="assets/icons/slope.png" alt="" decoding="async" loading="lazy"></div><div class="details"><span>Slope</span><span>↗</span></div></button>
<button class="game" data-game="2048" aria-label="Play 2048"><div class="art"><img src="assets/icons/2048.png" alt="" decoding="async" loading="lazy"></div><div class="details"><span>2048</span><span>↗</span></div></button>
<button class="game" data-game="hextris" aria-label="Play Hextris"><div class="art"><img src="assets/icons/hextris.png" alt="" decoding="async" loading="lazy"></div><div class="details"><span>Hextris</span><span>↗</span></div></button>
<button class="game" data-game="block-blast" aria-label="Play Block Blast"><div class="art"><img src="assets/icons/block-blast.png" alt="" decoding="async" loading="lazy"></div><div class="details"><span>Block Blast</span><span>↗</span></div></button>
<button class="game" data-game="fnae" aria-label="Play FNAE"><div class="art"><img src="assets/icons/fnae.ico" alt="" decoding="async" loading="lazy"></div><div class="details"><span>FNAE</span><span>↗</span></div></button>
<button class="game" data-game="fnaf-1" aria-label="Play Five Nights at Freddy's 1"><div class="art"><img src="assets/icons/fnaf-1.ico" alt="" decoding="async" loading="lazy"></div><div class="details"><span>FNAF 1</span><span>↗</span></div></button>
<button class="game" data-game="fnaf-2" aria-label="Play Five Nights at Freddy's 2"><div class="art"><img src="assets/icons/fnaf-2.ico" alt="" decoding="async" loading="lazy"></div><div class="details"><span>FNAF 2</span><span>↗</span></div></button>
<button class="game" data-game="fnaf-3" aria-label="Play Five Nights at Freddy's 3"><div class="art"><img src="assets/icons/fnaf-3.ico" alt="" decoding="async" loading="lazy"></div><div class="details"><span>FNAF 3</span><span>↗</span></div></button>
<button class="game" data-game="fnaf-4" aria-label="Play Five Nights at Freddy's 4"><div class="art"><img src="assets/icons/fnaf-4.ico" alt="" decoding="async" loading="lazy"></div><div class="details"><span>FNAF 4</span><span>↗</span></div></button>
</div><p class="credits">Geometry Dash web port: AlexBoops · bog / truffled · About 367 MB<br>Crazy Cattle 3D: Anna Mayberry · About 72 MB<br>Idle Breakout: Kodiqi · Progress saves in this browser.<br>Slope: Unity WebGL build · About 14 MB<br>2048 by Gabriele Cirulli · Hextris by Logan Engstrom and Garrett Finucane<br>Block Blast · FNAE · FNAF 1–4 use pinned upstream web builds and load only when opened.<br>Large games may take several minutes on slower connections.</p></template>
<script>
try{sessionStorage.removeItem('xyfer-start:'+location.pathname)}catch{}
const catalog={'geometry-dash':{title:'Geometry Dash',path:'games/geometry-dash/'},'crazy-cattle-3d':{title:'Crazy Cattle 3D',path:'games/crazy-cattle-3d/'},'idle-breakout':{title:'Idle Breakout',path:'games/idle-breakout/'},slope:{title:'Slope',path:'games/slope/'},'2048':{title:'2048',path:'games/2048/'},hextris:{title:'Hextris',path:'games/hextris/'},'block-blast':{title:'Block Blast',path:'games/block-blast/'},fnae:{title:'FNAE',path:'https://cdn.jsdelivr.net/gh/web-ports/fnae@ce3e15db144629f468916e186bc11547098706a2/index.html'},'fnaf-1':{title:'Five Nights at Freddy\'s 1',path:'https://cdn.jsdelivr.net/gh/irv77/hd_fnaf@8ddade73bcf0c30f4535d48af778d238f8ffd5a6/1/index.html'},'fnaf-2':{title:'Five Nights at Freddy\'s 2',path:'https://cdn.jsdelivr.net/gh/irv77/hd_fnaf@8ddade73bcf0c30f4535d48af778d238f8ffd5a6/2/index.html'},'fnaf-3':{title:'Five Nights at Freddy\'s 3',path:'https://cdn.jsdelivr.net/gh/irv77/hd_fnaf@8ddade73bcf0c30f4535d48af778d238f8ffd5a6/3/index.html'},'fnaf-4':{title:'Five Nights at Freddy\'s 4',path:'https://cdn.jsdelivr.net/gh/irv77/hd_fnaf@8ddade73bcf0c30f4535d48af778d238f8ffd5a6/4/index.html'}};let selected='geometry-dash';
const games=document.querySelector('#games'),settings=document.querySelector('#settings'),player=document.querySelector('#player'),frame=document.querySelector('#frame'),background=document.querySelector('.backdrop'),prefKey='xyfer-preferences';
const themes={red:{accent:'#ff4769',soft:'#ff7490',art:'#a82748',dark:'#220b13',filter:'none'},blue:{accent:'#4d8dff',soft:'#81adff',art:'#245fc8',dark:'#091a3a',filter:'hue-rotate(205deg)'},violet:{accent:'#a970ff',soft:'#c6a1ff',art:'#7138c4',dark:'#211038',filter:'hue-rotate(285deg)'},green:{accent:'#43d68d',soft:'#75e5aa',art:'#198653',dark:'#082a1b',filter:'hue-rotate(115deg)'},mono:{accent:'#b8b8c2',soft:'#dedee3',art:'#666673',dark:'#1c1c22',filter:'grayscale(1)'}};
const iconSvg={xyfer:['#130a0d','X'],document:['#4285f4','▤'],blank:['#e8e8eb',''],notes:['#f4c542','▱'],calculator:['#555b68','▦']};
function iconUrl(name){const [bg,glyph]=iconSvg[name]||iconSvg.xyfer;return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="${bg}"/><text x="32" y="43" text-anchor="middle" font-family="Arial" font-size="35" font-weight="700" fill="${name==='blank'?'#777':'white'}">${glyph}</text></svg>`)}
function readPrefs(){try{return{title:'Xyfer',icon:'xyfer',theme:'red',...JSON.parse(localStorage.getItem(prefKey)||'{}')}}catch{return{title:'Xyfer',icon:'xyfer',theme:'red'}}}
function applyPrefs(p){const t=themes[p.theme]||themes.red,r=document.documentElement;r.style.setProperty('--accent',t.accent);r.style.setProperty('--soft',t.soft);r.style.setProperty('--art',t.art);r.style.setProperty('--dark',t.dark);r.style.setProperty('--bgfilter',t.filter);document.title=p.title||'Xyfer';document.querySelector('#site-icon').href=iconUrl(p.icon);document.querySelector('meta[name=theme-color]').content=t.dark;document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===p.theme)));document.querySelectorAll('[data-icon]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.icon===p.icon)))}
let prefs=readPrefs(),pendingIcon=prefs.icon;applyPrefs(prefs);
function syncSettings(){const preset=document.querySelector('#title-preset'),known=[...preset.options].map(o=>o.value);preset.value=known.includes(prefs.title)?prefs.title:'custom';document.querySelector('#custom-title').value=preset.value==='custom'?prefs.title:'';document.querySelector('#custom-title-wrap').hidden=preset.value!=='custom';pendingIcon=prefs.icon;applyPrefs(prefs)}
document.querySelector('#title-preset').onchange=e=>document.querySelector('#custom-title-wrap').hidden=e.target.value!=='custom';document.querySelector('#icon-options').onclick=e=>{const b=e.target.closest('[data-icon]');if(!b)return;pendingIcon=b.dataset.icon;document.querySelectorAll('[data-icon]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))};
document.querySelector('#save-tab').onclick=()=>{const preset=document.querySelector('#title-preset').value,title=preset==='custom'?document.querySelector('#custom-title').value.trim():preset;prefs={...prefs,title:title||'Xyfer',icon:pendingIcon};localStorage.setItem(prefKey,JSON.stringify(prefs));applyPrefs(prefs);const saved=document.querySelector('#saved-tab');saved.textContent='Saved';setTimeout(()=>saved.textContent='',1600)};
document.querySelector('#themes').onclick=e=>{const b=e.target.closest('[data-theme]');if(!b)return;prefs={...prefs,theme:b.dataset.theme};localStorage.setItem(prefKey,JSON.stringify(prefs));applyPrefs(prefs)};document.querySelector('#reset-settings').onclick=()=>{prefs={title:'Xyfer',icon:'xyfer',theme:'red'};localStorage.removeItem(prefKey);syncSettings()};
function route(){const page=location.hash==='#games'?'games':location.hash==='#settings'?'settings':'home';if(page==='games'&&!games.dataset.loaded){games.dataset.loaded='true';games.insertAdjacentHTML('beforeend',document.querySelector('#library-content').innerHTML);games.querySelectorAll('[data-game]').forEach(b=>b.onclick=openPlayer)}games.hidden=page!=='games';settings.hidden=page!=='settings';background.classList.toggle('library',page!=='home');for(const name of ['home','games','settings']){const link=document.querySelector('#'+name+'-link');if(name===page)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')}if(page==='settings')syncSettings();if(!player.hidden)closePlayer()}
function closePlayer(){player.hidden=true;frame.removeAttribute('src');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});games.querySelector('[data-game="'+selected+'"]')?.focus()}
function openPlayer(e){selected=e.currentTarget.dataset.game;const game=catalog[selected];player.hidden=false;document.querySelector('#game-title').textContent=game.title;document.querySelector('#separate').href=game.path;frame.title=game.title;document.querySelector('#status').textContent='Loading player…';frame.src=game.path;frame.focus()}window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.origin!==location.origin)return;const states={'xyfer-player-ready':selected==='geometry-dash'?'Click Load game to start':'Loading game…','xyfer-game-loading':'Loading game…','xyfer-game-ready':'Ready','xyfer-game-error':'Unable to load. Please retry.'};if(states[e.data?.type])document.querySelector('#status').textContent=states[e.data.type]});frame.onload=()=>{if(['2048','hextris','block-blast','fnae','fnaf-1','fnaf-2','fnaf-3','fnaf-4'].includes(selected))document.querySelector('#status').textContent='Ready'};frame.onerror=()=>document.querySelector('#status').textContent='Unable to load. Please retry.';document.querySelector('#back').onclick=closePlayer;document.querySelector('#fullscreen').onclick=()=>player.requestFullscreen().catch(()=>document.querySelector('#status').textContent='Use Open separately for a larger view');document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!player.hidden&&!document.fullscreenElement)closePlayer()});addEventListener('hashchange',route);route();if(location.search)history.replaceState(null,'',location.pathname+location.hash);
</script></body></html>
