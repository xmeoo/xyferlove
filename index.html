function iconUrl(name){const [bg,glyph]=iconSvg[name]||iconSvg.xyfer;return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="${bg}"/><text x="32" y="43" text-anchor="middle" font-family="Arial" font-size="35" font-weight="700" fill="${name==='blank'?'#777':'white'}">${glyph}</text></svg>`)}
