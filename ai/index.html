<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Xyfer AI</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app">
  <aside id="sidebar"><div class="brand"><span class="logo">X</span><strong>xyfer ai</strong><button id="close-sidebar" aria-label="Close sidebar">×</button></div><button class="new-chat" id="new-chat"><span>＋</span> New chat</button><div class="history-label">Chats</div><nav id="history" aria-label="Chat history"></nav><div class="side-foot">mimo-v2.5</div></aside>
  <section class="chat"><header><button id="menu" aria-label="Open chat history">☰</button><div><strong id="chat-title">New chat</strong><span>xyfer ai</span></div><button id="delete-chat" aria-label="Delete this chat">⌫</button></header>
    <main id="messages"><div class="welcome"><div class="orb">X</div><h1>How can I help?</h1><p>Ask anything, brainstorm ideas, or get help with a project.</p><div class="suggestions"><button>Explain something difficult simply</button><button>Help me come up with an idea</button><button>Write a story with a twist</button></div></div></main>
    <form id="composer"><div class="composer-box"><textarea id="prompt" rows="1" maxlength="12000" placeholder="Message xyfer ai…" aria-label="Message xyfer ai"></textarea><button id="send" type="submit" aria-label="Send message">↑</button></div><small>xyfer ai can make mistakes. Check important information.</small></form>
  </section>
</div><script src="app.js"></script></body></html>
