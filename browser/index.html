<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xyfer browser</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#06060b;color:#f7f5ff;font:14px system-ui,sans-serif}body{display:flex;flex-direction:column;background:radial-gradient(circle at 20% 0,#7547ff38,transparent 35%),radial-gradient(circle at 85% 85%,#00d9ff25,transparent 35%),#06060b}.bar{display:flex;gap:7px;align-items:center;margin:10px;padding:8px;border:1px solid #ffffff17;border-radius:18px;background:#0c0b14d9;box-shadow:0 15px 45px #0009;backdrop-filter:blur(22px)}.bar button,.bar input{height:42px;border:1px solid #ffffff14;border-radius:13px;background:#151421;color:#fff;padding:10px 13px}.bar button{min-width:42px;cursor:pointer;color:#aaa4ba;font-size:16px;transition:.2s}.bar button:hover{background:#825cff;color:#fff}.bar button:disabled{opacity:.3}.bar form{display:flex;flex:1;min-width:0}.bar input{width:100%;outline:none;background:#090911;color:#ddd8e9;font-size:12px}.bar input:focus{border-color:#8b5cff;box-shadow:0 0 0 3px #8b5cff22}.viewport{position:relative;flex:1;min-height:0;margin:0 10px 10px;overflow:hidden;border:1px solid #ffffff12;border-radius:22px;background:#08080f}iframe{width:100%;height:100%;border:0;background:white}.start{position:relative;height:100%;display:grid;place-content:center;text-align:center;gap:20px;padding:24px;overflow:hidden}.start:before{content:'X';position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-54%) rotate(-10deg);color:#ffffff05;font:900 min(70vw,700px)/1 system-ui}.start:after{content:'XYFER // BROWSER';position:absolute;left:24px;bottom:20px;color:#5b566b;font:800 9px/1 monospace;letter-spacing:.2em}.start h1{position:relative;font-size:clamp(48px,9vw,112px);line-height:.8;letter-spacing:-.08em;text-transform:uppercase;margin:0;background:linear-gradient(100deg,#fff,#9e7dff 58%,#47e8ff);-webkit-background-clip:text;color:transparent}.start p{position:relative;color:#8d879c;margin:0;font:700 11px monospace;letter-spacing:.1em;text-transform:uppercase}.quick{position:relative;display:flex;justify-content:center;flex-wrap:wrap;gap:9px}.quick button{background:#11101b;color:#c7c1d2;border:1px solid #ffffff15;border-radius:999px;padding:11px 18px;cursor:pointer;font-size:11px;font-weight:800}.quick button:hover{color:#fff;border-color:#8b5cff;background:#171429}.status{position:absolute;bottom:14px;right:14px;background:#0b0a12df;color:#aaa3b8;border:1px solid #ffffff15;border-radius:12px;padding:9px 12px;font-size:10px;max-width:calc(100% - 28px)}body.embedded .bar{display:none}body.embedded .viewport{margin:0;border:0;border-radius:0}body.embedded .start{background:transparent}body.embedded .start h1{font-size:clamp(52px,10vw,118px)}[hidden]{display:none!important}@media(max-width:500px){.bar{gap:4px;margin:5px;padding:5px}.bar button{min-width:36px;height:38px;padding:7px}.bar input{height:38px;padding:8px}.viewport{margin:0 5px 5px;border-radius:15px}.start h1{font-size:48px}}
</style></head><body><div class="bar"><button id="back" aria-label="Back">←</button><button id="forward" aria-label="Forward">→</button><button id="reload" aria-label="Reload">↻</button><button id="home" aria-label="Browser home">⌂</button><form id="address-form"><input id="address" aria-label="Website address or search" placeholder="Search or enter a website" autocomplete="off" spellcheck="false"></form></div><div class="viewport"><div class="start" id="start"><h1>Browse from Xyfer</h1><p>Enter an address or open an app.</p><div class="quick"><button data-url="https://discord.com/app">Discord</button><button data-url="https://open.spotify.com/">Spotify</button><button data-url="https://www.youtube.com/">YouTube</button><button data-url="https://www.reddit.com/">Reddit</button></div></div><iframe id="page" title="Website" hidden referrerpolicy="no-referrer" allow="autoplay; fullscreen; clipboard-read; clipboard-write"></iframe><div class="status" id="status" role="status" hidden></div></div><script type="module" src="./browser.mjs?v=22"></script></body></html>
