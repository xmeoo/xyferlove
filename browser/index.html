<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xyfer browser</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#09070a;color:#f6eef0;font:14px system-ui,sans-serif}body{display:flex;flex-direction:column}.bar{display:flex;gap:8px;align-items:center;padding:12px;background:#170e13;border-bottom:1px solid #ffffff1c}.bar button,.bar input{border:1px solid #ffffff26;border-radius:9px;background:#0b070a;color:white;padding:10px}.bar button{min-width:40px;cursor:pointer}.bar button:disabled{opacity:.45}.bar form{display:flex;flex:1;min-width:0}.bar input{width:100%;outline:none}.bar input:focus{border-color:#ff4769}.viewport{position:relative;flex:1;min-height:0}iframe{width:100%;height:100%;border:0;background:white}.start{height:100%;display:grid;place-content:center;text-align:center;gap:16px;padding:24px}.start h1{font-size:clamp(27px,5vw,46px);margin:0}.start p{color:#bdaeb4;margin:0}.quick{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.quick button{background:#21151b;color:#fff;border:1px solid #ffffff25;border-radius:10px;padding:12px 18px;cursor:pointer}.status{position:absolute;bottom:10px;left:10px;background:#160e13d9;color:#cbbcc2;border-radius:8px;padding:7px 10px;font-size:11px;max-width:calc(100% - 20px)}[hidden]{display:none!important}@media(max-width:500px){.bar{gap:4px;padding:7px}.bar button{min-width:34px;padding:8px}.bar input{padding:8px}}
</style></head><body><div class="bar"><button id="back" aria-label="Back">←</button><button id="forward" aria-label="Forward">→</button><button id="reload" aria-label="Reload">↻</button><button id="home" aria-label="Browser home">⌂</button><form id="address-form"><input id="address" aria-label="Website address or search" placeholder="Search or enter a website" autocomplete="off" spellcheck="false"></form></div><div class="viewport"><div class="start" id="start"><h1>Browse from Xyfer</h1><p>Enter an address or open an app.</p><div class="quick"><button data-url="https://discord.com/app">Discord</button><button data-url="https://open.spotify.com/">Spotify</button><button data-url="https://www.youtube.com/">YouTube</button><button data-url="https://www.reddit.com/">Reddit</button></div></div><iframe id="page" title="Website" hidden referrerpolicy="no-referrer" allow="autoplay; fullscreen; clipboard-read; clipboard-write"></iframe><div class="status" id="status" role="status" hidden></div></div><script type="module" src="./browser.mjs?v=14"></script></body></html>
