<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>xyfer browser</title><style>
:root{--accent:#ff4769;--soft:#ff7490;--dark:#220b13}*{box-sizing:border-box;text-transform:lowercase!important}html,body{margin:0;width:100%;height:100%;background:#05050a;color:#f7f5ff;font:14px system-ui,sans-serif}body{display:flex;flex-direction:column;background:radial-gradient(circle at 15% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 35%),#05050a}.bar{display:flex;gap:6px;align-items:center;margin:10px;padding:7px;border:1px solid #ffffff17;border-radius:17px;background:#0b0b12e8;box-shadow:0 15px 45px #0009;backdrop-filter:blur(22px)}.bar button,.bar input{height:42px;border:1px solid #ffffff13;border-radius:12px;background:#12121c;color:#fff}.bar button{width:42px;flex:0 0 42px;display:grid;place-items:center;padding:0;cursor:pointer;color:var(--soft);transition:.18s}.bar button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.bar button:hover{border-color:color-mix(in srgb,var(--accent) 60%,#fff2);background:color-mix(in srgb,var(--accent) 24%,#11111a);color:#fff;transform:translateY(-1px)}.bar button:disabled{opacity:.28;transform:none}.bar form{display:flex;flex:1;min-width:0}.bar input{width:100%;outline:none;padding:10px 15px;background:#08080e;color:#eeeaf7;font-size:12px}.bar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}.viewport{position:relative;flex:1;min-height:0;margin:0 10px 10px;overflow:hidden;border:1px solid #ffffff10;border-radius:20px;background:linear-gradient(145deg,color-mix(in srgb,var(--dark) 28%,#08080e),#07070c)}iframe{width:100%;height:100%;border:0;background:white}.start{height:100%}.status{position:absolute;bottom:14px;right:14px;background:#0b0a12df;color:#aaa3b8;border:1px solid #ffffff15;border-radius:12px;padding:9px 12px;font-size:10px;max-width:calc(100% - 28px)}body.embedded .bar{display:none}body.embedded .viewport{margin:0;border:0;border-radius:0}[hidden]{display:none!important}@media(max-width:500px){.bar{gap:4px;margin:5px;padding:5px}.bar button{width:38px;flex-basis:38px;height:38px}.bar input{height:38px;padding:8px 11px}.viewport{margin:0 5px 5px;border-radius:14px}}
</style></head><body><div class="bar"><button id="back" aria-label="back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><button id="forward" aria-label="forward"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button><button id="reload" aria-label="reload"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 4v7h-7"/></svg></button><button id="home" aria-label="browser home"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M5 10v10h14V10M9 20v-6h6v6"/></svg></button><form id="address-form"><input id="address" aria-label="website address or search" placeholder="search or enter a website" autocomplete="off" spellcheck="false"></form></div><div class="viewport"><div class="start" id="start"></div><iframe id="page" title="website" hidden referrerpolicy="no-referrer" allow="autoplay; fullscreen; clipboard-read; clipboard-write"></iframe><div class="status" id="status" role="status" hidden></div></div><script type="module" src="./browser.mjs?v=23"></script><script>const palettes={red:['#ff4769','#ff7490','#220b13'],blue:['#4d8dff','#81adff','#091a3a'],violet:['#a970ff','#c6a1ff','#211038'],green:['#43d68d','#75e5aa','#082a1b'],cyan:['#13c8d4','#71e6eb','#06272b'],orange:['#ff9b42','#ffc077','#311607'],gold:['#f1c75b','#ffe291','#2b2208'],pink:['#f06cb5','#ffa3d3','#2e0c20'],mono:['#b8b8c2','#dedee3','#1c1c22']};function theme(){let p={};try{p=JSON.parse(localStorage.getItem('xyfer-preferences')||'{}')}catch{}const c=palettes[p.theme]||palettes.red;document.documentElement.style.setProperty('--accent',c[0]);document.documentElement.style.setProperty('--soft',c[1]);document.documentElement.style.setProperty('--dark',c[2])}theme();addEventListener('storage',theme)</script></body></html>
