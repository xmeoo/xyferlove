<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,user-scalable=no"><base href="https://cdn.jsdelivr.net/gh/SomeRandomFella/portsandrips@67547cbcdb21614540b26405e30cb54085890480/blockblast-port/play/"><title>Block Blast</title><link rel="stylesheet" href="style.css"><style>html,body,#canvas{width:100%;height:100%;margin:0;background:#10182b}#load-note{position:fixed;inset:auto 0 24px;text-align:center;color:#b8c4dc;font:13px Arial}</style></head><body><canvas id="canvas"></canvas><div id="spinner" class="pending"></div><div id="load-note">Loading Block Blast…</div><script>
(async()=>{try{const parts=['game.love.part000','game.love.part001','game.love.part002','game.love.part003','game.love.part004','game.love.part005'];let done=0;const buffers=await Promise.all(parts.map(async p=>{const r=await fetch(p);if(!r.ok)throw Error('download');const value=await r.arrayBuffer();document.querySelector('#load-note').textContent=`Loading Block Blast… ${++done} / ${parts.length}`;return value}));const url=URL.createObjectURL(new Blob(buffers,{type:'application/octet-stream'}));const script=document.createElement('script');script.src='player.js?g='+encodeURIComponent(url)+'&n=1';script.onload=()=>document.querySelector('#load-note').remove();document.body.appendChild(script)}catch{document.querySelector('#load-note').textContent='Unable to load. Please close and try again.'}})();
</script></body></html>
