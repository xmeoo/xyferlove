<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading game…</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#080609;color:#fff;font:16px system-ui,sans-serif}
    body{display:grid;place-items:center;text-align:center}.loader{width:min(420px,80vw)}
    h1{font-size:24px;margin:0 0 16px}p{color:#b9aeb2;margin:0}progress{width:100%;margin-top:20px;accent-color:#ff4769}
  </style>
</head>
<body>
  <div class="loader"><h1>Preparing game…</h1><p id="message">Downloading the game launcher</p><progress></progress></div>
  <script>
  (()=>{
    const builds=new Set(['591-fix2.html','819-fix2.html','752-fix.html','803-fix2.html','723-fix.html','623-fix2.html','716-fix3.html','825.html','560-fix2.html','626-fix2.html','695-fix.html','286-fix.html','585-fix.html','706-fix2.html','557-fix2.html','90-fix3.html','262-fix.html','790-fix.html','468-fix2.html','771-fix2.html','705-fix2.html','826-f.html','754-fix2.html','814.html','628-fix2.html','842.html','589-fix3.html','590-fix3.html','789-fix2.html','588-fix.html','669-fix.html','827-f.html','196-fix2.html','718-fix.html','791-fix2.html','776-fix.html','59-fix2.html','63-fix2.html','65-fix2.html','125-fix2.html','181-fix.html','182-f.html','183.html','185-fix2.html','187-fix.html','190-fix2.html','191-fix2.html','192-fix2.html','194-fix2.html','195-fix2.html','205-fix2.html','217-fix2.html','233-fix.html','259-fix2.html','267-fix2.html','314-fix2.html','423-fix2.html','427-fix2.html','445-fix2.html','446-fix2.html','450-fix2.html','454-fix2.html','456-fix2.html','457-fix2.html','462-fix2.html','465-fix2.html','466-fix2.html','467-fix2.html','501-fix.html','505-fix2.html','506-fix2.html','508-fix2.html','607-fix2.html','622-fix.html','848.html','851.html','857.html','865.html','869.html']);
    const build=new URLSearchParams(location.search).get('build');
    const root='https://gn-math.dev';
    const source=root+'/s/EE0_FEFXflkxUx5iECccXCcNRB9_GDdDXysSex5LLgFQGDgFPFIDP1U8DFQnJF8MOBh9/';
    const message=document.querySelector('#message');
    const notify=type=>parent.postMessage({type},location.origin);
    if(!builds.has(build)){message.textContent='Invalid game build.';notify('xyfer-game-error');return}
    notify('xyfer-game-loading');
    fetch(source+build,{cache:'no-store'}).then(response=>{
      if(!response.ok)throw new Error('The game launcher could not be downloaded.');
      return response.text();
    }).then(html=>{
      html=html.replace(/<base\b[^>]*href\s*=\s*(["'])\/s\//i,'<base href=$1'+root+'/s/');
      if(!/<base\b/i.test(html))html=html.replace(/<head([^>]*)>/i,'<head$1><base href="'+source+'">');
      html=html.replace(/<script\b[^>]*googletagmanager\.com[^>]*><\/script>/gi,'');
      document.open();document.write(html);document.close();
      notify('xyfer-game-ready');
    }).catch(error=>{message.textContent=error.message||'Unable to load this game.';notify('xyfer-game-error')});
  })();
  </script>
</body>
</html>
