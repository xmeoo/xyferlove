<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idle Breakout</title><link rel="icon" href="../../assets/icons/idle-breakout.png"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080407;color:#f6eef0;font:14px Arial,sans-serif}#canvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh * 4 / 3));height:auto;max-height:100vh;outline:none}#loading{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;background:radial-gradient(ellipse at 50% 85%,#550b23,transparent 65%),#080407}#loading[hidden]{display:none}img{width:130px;height:130px;object-fit:cover;border-radius:28px}h1{margin:0;font-size:28px;font-weight:500}progress{width:280px;accent-color:#ed365e}p{margin:0;color:#c5a5af;font-size:12px}#network-status{position:fixed;bottom:10px;left:14px;pointer-events:none}
</style></head><body><canvas id="canvas" width="1024" height="768" tabindex="0" aria-label="Idle Breakout game"></canvas><div id="loading"><img src="../../assets/icons/idle-breakout.png" alt=""><h1>Idle Breakout</h1><progress id="progress" value="0" max="1"></progress><p id="label">Preparing game…</p></div><p id="network-status" role="status">Preparing…</p><script type="module" src="launch.mjs"></script></body></html>
