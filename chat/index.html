<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Xyfer Public Chat</title>
<style>
@font-face{font-family:Manrope;src:url('../assets/fonts/manrope-regular.woff2') format('woff2');font-weight:400;font-display:swap}@font-face{font-family:Manrope;src:url('../assets/fonts/manrope-semibold.woff2') format('woff2');font-weight:600;font-display:swap}:root{color-scheme:dark;--accent:#ff4769;--line:#ffffff1c;--muted:#ad969e}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#090608;color:#f7eff2;font-family:Manrope,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;min-height:0}.top{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--line);background:#10090c}.title{font-size:18px;font-weight:600;flex:1}.presence{display:flex;align-items:center;gap:7px;color:#ccb9bf;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#857a7d;box-shadow:0 0 0 4px #ffffff0a}.dot.live{background:#54dc92;box-shadow:0 0 10px #54dc92}.profile{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line);background:#0d090b}.profile label{font-size:12px;color:var(--muted)}.profile input{width:min(220px,45vw);border:1px solid var(--line);border-radius:9px;background:#070506;color:white;padding:9px 11px}.quiet{border:1px solid var(--line);border-radius:9px;background:#ffffff08;color:#d8cbd0;padding:9px 12px}.note{margin-left:auto;color:#927f86;font-size:11px}.messages{overflow:auto;padding:24px;display:flex;flex-direction:column;gap:13px;scrollbar-color:#4b2933 transparent}.empty{margin:auto;text-align:center;color:#a58f96;max-width:400px;line-height:1.6}.message{align-self:flex-start;max-width:min(680px,86%);padding:11px 14px;border:1px solid var(--line);border-radius:4px 16px 16px;background:#171014;overflow-wrap:anywhere}.message.mine{align-self:flex-end;border-color:#ff476944;background:#431522}.meta{display:flex;gap:9px;align-items:center;margin-bottom:5px;font-size:11px;color:#a78f97}.name{font-weight:600;color:#ffdce4}.block{border:0;background:none;color:#9c878e;padding:0;margin-left:2px;font-size:10px}.block:hover{color:#ff8ba2}.text{white-space:pre-wrap;line-height:1.45;font-size:14px}.system{align-self:center;color:#9b888e;font-size:11px}.composer{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:#10090c}.composer input{min-width:0;border:1px solid #ffffff25;border-radius:12px;background:#080608;color:white;padding:13px 15px}.composer button{border:0;border-radius:12px;background:var(--accent);color:white;font-weight:600;padding:0 20px}.composer button:disabled{opacity:.45;cursor:default}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}@media(max-width:620px){.top,.profile{padding-left:14px;padding-right:14px}.profile{flex-wrap:wrap}.note{width:100%;margin-left:0}.messages{padding:16px}.composer{padding:11px}.message{max-width:92%}}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="title">Public chat</div><div class="presence"><span class="dot" id="dot"></span><span id="status">Connecting…</span><span id="online"></span></div></header>
  <section class="profile"><label for="name">Your name</label><input id="name" maxlength="24" autocomplete="nickname" aria-label="Your chat name"><button class="quiet" id="save-name">Save</button><button class="quiet" id="clear">Clear</button><span class="note">Live peer-to-peer room · no permanent history · don’t share private info</span></section>
  <main class="messages" id="messages" aria-live="polite"><div class="empty" id="empty">Connecting to the public room…<br>Be respectful and do not share private information.</div></main>
  <form class="composer" id="composer"><input id="message" maxlength="400" autocomplete="off" placeholder="Message everyone online…" aria-label="Message" disabled><button id="send" disabled>Send</button></form>
</div>
<script type="module" src="chat.mjs?v=16"></script>
</body>
</html>
